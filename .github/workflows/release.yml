name: Release

# Builds the installers when a version tag is pushed (v0.1.0, or v0.1.0-preview.1
# for a rehearsal) and attaches them to a DRAFT release, so nothing is public
# until someone reads the notes and presses Publish. Run it by hand
# (Actions > Release > Run workflow) to build the installers without a release:
# they come out as downloadable artifacts. Steps and secrets: docs/RELEASING.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # A tag that does not match the version in the code would ship an installer
  # that calls itself something else. Stop before building anything.
  version:
    name: check the version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the app's version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          base="${tag%%-*}"
          cargo=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          tauri=$(grep -m1 '"version"' app/src-tauri/tauri.conf.json | sed -E 's/.*: *"([^"]+)".*/\1/')
          npm=$(grep -m1 '"version"' app/package.json | sed -E 's/.*: *"([^"]+)".*/\1/')
          echo "tag $tag (version $base); Cargo.toml $cargo; tauri.conf.json $tauri; package.json $npm"
          for v in "$cargo" "$tauri" "$npm"; do
            if [ "$v" != "$base" ]; then
              echo "::error::The tag says $base but a version file says $v. Bump them together, then tag again."
              exit 1
            fi
          done

  # The three builds start together; if each made the draft release itself
  # they would make three, each with only its own files and its own
  # latest.json. Make the one draft here and let the builds add to it.
  draft:
    name: make the draft release
    needs: version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.make.outputs.id }}
    steps:
      - id: make
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BODY: |
            **Preview release.** Lampstand is free and open source (GPL-3.0). This is an early version for churches willing to test it; please report what you find.

            Already installed? Lampstand offers this release itself under **Help › About**; there is no need to download it again. (The Linux `.deb` does not update itself; the AppImage does.)

            - **Mac:** open the `.dmg` and drag Lampstand to Applications.
            - **Windows:** run the installer. Windows will warn that the publisher is unknown (SmartScreen): choose **More info**, then **Run anyway**. The installer is not signed yet.
            - **Linux:** make the `.AppImage` executable and run it, or install the `.deb`. A GPU with Vulkan support is needed for the projector output.

            **Stuck, or something not working?** Ask in [Discussions](https://github.com/incrhst/lampstand/discussions). Found a bug or have an idea? [Open an issue](https://github.com/incrhst/lampstand/issues/new/choose). In Lampstand, **Help › Help and feedback** has buttons for all three that fill in your version for you.

            See the changes below.
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name==\"$GITHUB_REF_NAME\" and .draft) | .id" | head -n 1)
          if [ -z "$id" ]; then
            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$GITHUB_REF_NAME" -f name="Lampstand $GITHUB_REF_NAME" \
              -f body="$BODY" -F draft=true -F prerelease=false --jq .id)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: [version, draft]
    if: ${{ !cancelled() && needs.version.result == 'success' && (needs.draft.result == 'success' || needs.draft.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple silicon and Intel)
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
          # Built on the older Ubuntu so the AppImage runs on older distributions.
          - name: Linux (AppImage and .deb)
            os: ubuntu-22.04
            rust-targets: ""
            args: --bundles appimage,deb
          - name: Windows (installer)
            os: windows-latest
            rust-targets: ""
            args: --bundles nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Tauri's system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-3-dev librsvg2-dev \
            libssl-dev libxdo-dev libayatana-appindicator3-dev libasound2-dev file xdg-utils

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: release-${{ matrix.os }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Web UI
        working-directory: app
        run: npm ci

      # On a tag this makes (or adds to) a draft pre-release. By hand it only
      # builds, and the next step uploads the installers as artifacts.
      #
      # The Apple secrets sign and notarise the macOS build. Without them the
      # build still succeeds, unsigned, which is what a rehearsal in a fork
      # gets. The release is not published until a person publishes it.
      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Signs the update files that installed copies check before they
          # install anything. Required: a build with updates on fails without it.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          releaseId: ${{ needs.draft.outputs.id }}
          releaseDraft: true
          # Installed copies look for the latest release that is NOT a
          # pre-release, so a published release is what people are offered.
          # To keep a build away from everyone, mark it a pre-release.
          prerelease: false
          # Adds latest.json (the update's address, version and signature).
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      # The build notarises and staples the app inside the disk image, but not
      # the disk image. Do that too, so the image itself passes Gatekeeper, and
      # on a release put the stapled image in place of the one just uploaded.
      - name: Notarise the disk image (macOS)
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          RELEASE_ID: ${{ needs.draft.outputs.id }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_ID:-}" ]; then
            echo "No Apple credentials: the disk image stays as built."
            exit 0
          fi
          dmg=$(find target -path '*bundle/dmg/*.dmg' | head -n 1)
          echo "Notarising $dmg"
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          if [ -n "${RELEASE_ID:-}" ]; then
            name=$(basename "$dmg")
            old=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --jq ".[] | select(.name==\"$name\") | .id")
            if [ -n "$old" ]; then gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old"; fi
            gh api -X POST "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$name" \
              -H "Content-Type: application/x-apple-diskimage" --input "$dmg" --jq '.name'
          fi

      - name: Keep the installers (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          # The installers and their update signatures, whichever platform built
          # them, wherever the bundler put them (a universal Mac build uses a
          # different folder from the others).
          path: |
            target/**/bundle/**/*.dmg
            target/**/bundle/**/*.deb
            target/**/bundle/**/*.rpm
            target/**/bundle/**/*.AppImage
            target/**/bundle/**/*.exe
            target/**/bundle/**/*.msi
            target/**/bundle/**/*.sig
            target/**/bundle/**/*.tar.gz
            target/**/bundle/**/*.zip
          if-no-files-found: error
