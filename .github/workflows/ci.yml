name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `labeled`, so adding the all-platforms label re-runs with macOS and Windows.
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # A change that only touches documentation (docs/, the website's pages in
  # site/docs/, or Markdown files) cannot break the build, so the heavy jobs
  # below are skipped for it. A skipped job still counts as passing for the
  # required checks. Anything else, and every push to main, runs everything.
  #
  # A pull request is built and tested on Linux. macOS and Windows join only
  # when the change could behave differently there (`platforms`): the
  # dependencies or toolchain, CI itself, the bundle settings, the renderer,
  # the audio player, the sync networking, or Rust code that adds or removes
  # an operating-system `cfg`. The label `all-platforms` forces them. Every
  # push to main, and every release, still runs all three.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      heavy: ${{ steps.diff.outputs.heavy }}
      platforms: ${{ steps.diff.outputs.platforms }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          ALL_PLATFORMS: ${{ contains(github.event.pull_request.labels.*.name, 'all-platforms') }}
        run: |
          heavy=true
          platforms=true
          if [ "$EVENT" = "pull_request" ]; then
            heavy=false
            platforms=$ALL_PLATFORMS
            while IFS= read -r file; do
              case "$file" in
                docs/*|site/docs/*|*.md) ;;
                *) heavy=true ;;
              esac
              case "$file" in
                Cargo.toml|Cargo.lock|*/Cargo.toml|deny.toml|rust-toolchain*|.cargo/*|\
                */package.json|*/package-lock.json|\
                .github/workflows/*|\
                app/src-tauri/tauri.conf.json|app/src-tauri/build.rs|app/src-tauri/*.plist|app/src-tauri/capabilities/*|\
                crates/lampstand-render/*|crates/lampstand-media/*|crates/lampstand-sync/src/net/*)
                  platforms=true; echo "all platforms: $file" ;;
              esac
            done < <(git diff --name-only "origin/$BASE...HEAD")
            # Rust that adds or removes operating-system-specific code
            # (cfg, cfg!, cfg_attr, any/all/not, target_vendor), or that
            # changes a source file holding some (code inside an existing
            # OS-only block). Tests are left out of the second check.
            os_cfg='cfg(_attr)?!?\(.*(target_os|target_family|target_vendor|windows|unix)'
            if git diff "origin/$BASE...HEAD" -- '*.rs' | grep -qE "^[+-].*$os_cfg"; then
              platforms=true; echo "all platforms: a cfg for an operating system changed"
            fi
            while IFS= read -r file; do
              case "$file" in */tests/*) continue ;; esac
              if [ -f "$file" ] && grep -qE "$os_cfg" "$file"; then
                platforms=true; echo "all platforms: $file has operating-system-specific code"
              fi
            done < <(git diff --name-only "origin/$BASE...HEAD" -- '*.rs')
          fi
          echo "heavy=$heavy" >> "$GITHUB_OUTPUT"
          echo "platforms=$platforms" >> "$GITHUB_OUTPUT"
          echo "heavy jobs needed: $heavy; macOS and Windows needed: $platforms"

  # The matrix job always runs so the required checks 'check (ubuntu-latest)',
  # 'check (macos-latest)' and 'check (windows-latest)' always report. A job
  # skipped with a job-level `if` reports under the unexpanded name
  # 'check (${{ matrix.os }})', which leaves the required checks missing and
  # blocks a docs-only change. Its steps are skipped instead.
  check:
    name: check (${{ matrix.os }})
    needs: changes
    runs-on: ${{ matrix.os }}
    # A cold cache and slow apt have taken a successful job to 36 minutes.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # Linux runs every heavy change; macOS and Windows only when it could
      # behave differently there (see `changes`).
      RUN: ${{ needs.changes.outputs.heavy == 'true' && (matrix.os == 'ubuntu-latest' || needs.changes.outputs.platforms == 'true') }}
    steps:
      - name: Skipped on this system
        if: env.RUN != 'true'
        run: echo "Nothing in this change behaves differently on ${{ matrix.os }}; Linux checks it. Every push to main runs all three."

      - uses: actions/checkout@v4
        if: env.RUN == 'true'

      - name: Install Vulkan software adapter (lavapipe) and Tauri's system libraries
        if: env.RUN == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1 vulkan-tools \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-3-dev librsvg2-dev libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
        if: env.RUN == 'true'
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        if: env.RUN == 'true'

      # The app crate embeds the built web UI (app/dist), so it is built
      # before anything compiles the workspace.
      - uses: actions/setup-node@v4
        if: env.RUN == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            crates/lampstand-server/web/package-lock.json

      - name: Web UI (install, type-check, test, build)
        if: env.RUN == 'true'
        working-directory: app
        run: |
          npm ci
          npm run check
          npm test
          npm run build

      # The website's Download button chooses an installer from a release.
      - name: Website (download button)
        if: env.RUN == 'true'
        run: node --test site/download.test.js

      - name: Format
        if: env.RUN == 'true'
        run: cargo fmt --all --check

      - name: Clippy
        if: env.RUN == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings

      # A test that hangs fails the job here rather than holding it for the
      # six-hour default; the slowest full run so far took under 20 minutes.
      - name: Test
        if: env.RUN == 'true'
        timeout-minutes: 30
        run: cargo test --workspace

      # T43: the OBS browser source page. The compiled script is committed
      # (the server embeds it, so cargo needs no Node), so it must be fresh.
      # The Playwright test compares the page with render_offscreen, which
      # needs the software adapter installed above, so both run on Linux only
      # (Windows checkouts also change line endings in the diff).
      - name: OBS browser source (type-check, compiled script is current)
        if: env.RUN == 'true' && runner.os == 'Linux'
        working-directory: crates/lampstand-server/web
        run: |
          npm ci
          npm run check
          npm run build
          git diff --exit-code obs/dist

      # T100: the phone remote's page (crates/lampstand-server/web/remote/dist)
      # is not checked for freshness. `npm run build` above rebuilt it from
      # this commit before cargo compiled, as the release's build does, so
      # what is tested and shipped is never stale. The checked-in copy only
      # serves builds without Node, and may lag main.

      # Also runs the phone remote's test (tests/remote.spec.ts).
      - name: OBS browser source (Playwright)
        if: env.RUN == 'true' && runner.os == 'Linux'
        working-directory: crates/lampstand-server/web
        run: |
          npx playwright install --with-deps chromium-headless-shell
          npx playwright test

  msrv:
    name: msrv (1.95)
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-3-dev librsvg2-dev libasound2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build the web UI
        working-directory: app
        run: npm ci && npm run build
      - name: Check
        run: cargo check --workspace --all-targets --locked

  deny:
    name: cargo deny
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans
