name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # A change that only touches documentation (docs/, the website's pages in
  # site/docs/, or Markdown files) cannot break the build, so the heavy jobs
  # below are skipped for it. A skipped job still counts as passing for the
  # required checks. Anything else, and every push to main, runs everything.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    outputs:
      heavy: ${{ steps.diff.outputs.heavy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          heavy=true
          if [ "$EVENT" = "pull_request" ]; then
            heavy=false
            while IFS= read -r file; do
              case "$file" in
                docs/*|site/docs/*|*.md) ;;
                *) heavy=true ;;
              esac
            done < <(git diff --name-only "origin/$BASE...HEAD")
          fi
          echo "heavy=$heavy" >> "$GITHUB_OUTPUT"
          echo "heavy jobs needed: $heavy"

  # The matrix job always runs so the required checks 'check (macos-latest)' and
  # 'check (windows-latest)' always report. A job skipped with a job-level `if`
  # reports under the unexpanded name 'check (${{ matrix.os }})', which leaves
  # the required checks missing and blocks a docs-only change. Its steps are
  # skipped instead.
  check:
    name: check (${{ matrix.os }})
    needs: changes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.heavy == 'true'

      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.heavy == 'true'
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.heavy == 'true'

      # The app crate embeds the built web UI (app/dist), so it is built
      # before anything compiles the workspace.
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.heavy == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            crates/lampstand-server/web/package-lock.json

      - name: Web UI (install, type-check, test, build)
        if: needs.changes.outputs.heavy == 'true'
        working-directory: app
        run: |
          npm ci
          npm run check
          npm test
          npm run build

      # The website's Download button chooses an installer from a release.
      - name: Website (download button)
        if: needs.changes.outputs.heavy == 'true'
        run: node --test site/download.test.js

      - name: Format
        if: needs.changes.outputs.heavy == 'true'
        run: cargo fmt --all --check

      - name: Clippy
        if: needs.changes.outputs.heavy == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        if: needs.changes.outputs.heavy == 'true'
        run: cargo test --workspace

  # Linux is not supported for now (no Linux installers are built; see
  # docs/RELEASING.md). This job keeps the one check that needs the Linux
  # runner: the OBS browser source page is compared with render_offscreen on
  # the lavapipe software GPU. It reports on every heavy change but is NOT a
  # required check, so a failure here does not block a merge.
  obs-page:
    name: obs-page (linux, not required)
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vulkan software adapter (lavapipe) and Tauri's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1 vulkan-tools \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-3-dev librsvg2-dev libasound2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            crates/lampstand-server/web/package-lock.json

      # The app crate embeds the built web UI (app/dist), so it is built
      # before anything compiles the workspace.
      - name: Web UI (install, build)
        working-directory: app
        run: |
          npm ci
          npm run build

      # T43: the OBS browser source page. The compiled script is committed
      # (the server embeds it, so cargo needs no Node), so it must be fresh.
      - name: OBS browser source (type-check, compiled script is current)
        working-directory: crates/lampstand-server/web
        run: |
          npm ci
          npm run check
          npm run build
          git diff --exit-code obs/dist

      # Needs the software adapter installed above.
      - name: OBS browser source (Playwright)
        working-directory: crates/lampstand-server/web
        run: |
          npx playwright install --with-deps chromium-headless-shell
          npx playwright test

  msrv:
    name: msrv (1.95)
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-3-dev librsvg2-dev libasound2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build the web UI
        working-directory: app
        run: npm ci && npm run build
      - name: Check
        run: cargo check --workspace --all-targets --locked

  deny:
    name: cargo deny
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans
