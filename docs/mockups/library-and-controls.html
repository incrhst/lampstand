<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Library and Controls</title>
<!-- Mockup: Lampstand with one hideable "Library & controls" sidebar, after the
     "Overview" side card pattern. Plan and Present each keep their own
     open or hidden state for the session, and it opens again on every launch. It opens on a front page (rows that drill in,
     then short lists with counts); a row swaps the content in place, with
     "Back" to come back. \ hides and shows it. -->
<style>
:root {
  --canvas: #121419; --panel: #1b1f27; --raised: #232833;
  --line: #2a303b; --line-strong: #3a4250;
  --text: #e6e8ec; --muted: #9aa3b2; --faint: #808a9b;
  --gold: #f0c75e; --gold-hover: #f5d47e; --on-gold: #1b1f27; --gold-soft: rgba(240,199,94,.12);
  --live: #e5484d; --live-strong: #c62f37; --ready: #46a758; --ready-text: #5cc16f;
  --warn: #f5a524; --warn-soft: rgba(245,165,36,.12);
  --section-verse: #7fa8f5; --section-chorus: #4cc7b0; --section-bridge: #eb9a5c;
  --radius: 6px; --radius-lg: 10px; --ease: cubic-bezier(.23,1,.32,1);
  color-scheme: dark;
  font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans", sans-serif;
  font-size: 15px; line-height: 1.4; -webkit-font-smoothing: antialiased;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--canvas); color: var(--text); }
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
kbd { font: 600 .7rem/1 ui-monospace, Menlo, monospace; padding: .2em .4em; border: 1px solid var(--line-strong); border-radius: 4px; color: var(--muted); }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
svg { flex-shrink: 0; }

.shell { height: 100%; display: grid; grid-template-rows: auto 1fr auto; min-width: 0; }

/* Top bar */
header { display: flex; align-items: center; gap: 1rem; padding: .6rem 1rem; border-bottom: 1px solid var(--line); }
.logo { display: flex; align-items: center; gap: .45rem; font-weight: 700; color: var(--gold); font-size: 1.05rem; margin-right: .5rem; }
.modes { display: flex; gap: .25rem; background: var(--panel); padding: .2rem; border-radius: var(--radius); border: 1px solid var(--line); }
.modes button { padding: .35rem .9rem; border-radius: 4px; color: var(--muted); font-weight: 500; }
.modes button[aria-pressed="true"] { background: var(--raised); color: var(--text); }
.right { margin-left: auto; display: flex; align-items: center; gap: .4rem; }
.onair { color: var(--muted); font-size: .9rem; margin-right: .6rem; }
.onair b { color: var(--text); font-weight: 600; }
.tb { display: inline-flex; align-items: center; gap: .4rem; padding: .4rem .7rem; border-radius: var(--radius); color: var(--muted); font-size: .9rem; }
.tb:hover { background: var(--raised); color: var(--text); }
.tb.panel-toggle { border: 1px solid var(--line-strong); color: var(--text); }
.tb.panel-toggle[aria-pressed="true"] { background: var(--raised); }

/* Body: main + one panel */
.body { display: grid; grid-template-columns: minmax(0,1fr) 360px; gap: 0; min-height: 0; transition: grid-template-columns .28s var(--ease); }
.body.closed { grid-template-columns: minmax(0,1fr) 0px; }
main { min-width: 0; overflow: auto; padding: 1.4rem 1.6rem 2rem; }
.panel-slot { min-width: 0; overflow: hidden; padding: .9rem .9rem .9rem 0; }
.body.closed .panel-slot { padding: 0; visibility: hidden; transition: visibility 0s .28s; }
.panel { width: 350px; height: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 1px 0 rgba(255,255,255,.02) inset, 0 8px 28px rgba(0,0,0,.25); }
.panel-head { display: flex; align-items: center; gap: .4rem; padding: .75rem .8rem .55rem 1rem; }
.panel-head h2 { font-size: .9rem; font-weight: 500; color: var(--muted); }
.panel-head .back { display: inline-flex; align-items: center; gap: .3rem; color: var(--muted); font-size: .9rem; padding: .2rem .4rem .2rem .1rem; border-radius: 4px; }
.panel-head .back:hover { color: var(--text); background: var(--raised); }
.panel-head .crumb { color: var(--text); font-weight: 600; font-size: .95rem; }
.panel-head .hide { margin-left: auto; font-size: .8rem; color: var(--faint); display: inline-flex; gap: .35rem; align-items: center; padding: .25rem .4rem; border-radius: 4px; }
.panel-head .hide:hover { color: var(--text); background: var(--raised); }
.panel-body { overflow: auto; flex: 1; padding-bottom: .6rem; }
.panel-body.enter { animation: slide .22s var(--ease); }
.panel-body.enter-back { animation: slideback .22s var(--ease); }
@keyframes slide { from { opacity: 0; transform: translateX(14px); } }
@keyframes slideback { from { opacity: 0; transform: translateX(-14px); } }

/* Front page: the Library on top, the controls under it, the same in both modes */
.zone { padding: .2rem .45rem .55rem; border-bottom: 1px solid var(--line); }
.zone-head { font-size: .95rem; font-weight: 650; color: var(--text); padding: .55rem .55rem .45rem; }
.find { width: calc(100% - 1.1rem); margin: 0 .55rem .35rem; display: flex; align-items: center; gap: .55rem; background: var(--canvas); border: 1px solid var(--line-strong); border-radius: var(--radius); padding: .55rem .65rem; color: var(--faint); font-size: .92rem; text-align: left; }
.find:hover { border-color: var(--gold); color: var(--muted); }
/* Overview pieces */
.nav { padding: 0 .45rem .5rem; border-bottom: 1px solid var(--line); }
.nav-row { width: 100%; display: flex; align-items: center; gap: .75rem; padding: .55rem .55rem; border-radius: 8px; text-align: left; font-size: 1rem; }
.nav-row > span:first-of-type { white-space: nowrap; }
.nav-row:hover { background: var(--raised); }
.nav-row .icon { color: var(--muted); }
.nav-row .sum { margin-left: auto; color: var(--faint); font-size: .85rem; display: inline-flex; align-items: center; gap: .4rem; }
.nav-row .chev { color: var(--faint); }
.group { padding: .7rem .45rem .4rem; border-bottom: 1px solid var(--line); }
.group:last-child { border-bottom: 0; }
.group-head { display: flex; align-items: center; gap: .5rem; padding: 0 .55rem .35rem; color: var(--muted); font-size: .9rem; }
.count { font-size: .75rem; color: var(--muted); background: var(--raised); border-radius: 999px; padding: .05rem .45rem; }
.group-head .act { margin-left: auto; font-size: .8rem; color: var(--faint); padding: .1rem .35rem; border-radius: 4px; }
.group-head .act:hover { color: var(--text); background: var(--raised); }
.row { width: 100%; display: flex; align-items: center; gap: .65rem; padding: .42rem .55rem; border-radius: 8px; text-align: left; font-size: .95rem; min-width: 0; }
button.row:hover { background: var(--raised); }
.row .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.row .sub { color: var(--faint); font-size: .85rem; white-space: nowrap; }
.row .end { margin-left: auto; color: var(--faint); font-size: .82rem; display: inline-flex; align-items: center; gap: .35rem; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--faint); flex-shrink: 0; }
.dot.live { background: var(--live); } .dot.ok { background: var(--ready); } .dot.warn { background: var(--warn); }
.tag { font: 700 .66rem/1 system-ui; letter-spacing: .06em; padding: .25em .45em; border-radius: 4px; }
.tag.live { background: var(--live-strong); color: #fff; }
.tag.next { background: var(--gold-soft); color: var(--gold); }
.row.is-live { background: rgba(229,72,77,.08); }
.ico-k { width: 22px; height: 22px; border-radius: 5px; display: grid; place-items: center; background: var(--raised); color: var(--muted); flex-shrink: 0; }

/* Drill-in views */
.view { padding: 0 1rem 1rem; display: grid; gap: .8rem; }
.tabs { display: flex; background: var(--canvas); border: 1px solid var(--line); border-radius: var(--radius); padding: .2rem; }
.tabs button { flex: 1; padding: .35rem 0; border-radius: 4px; color: var(--muted); font-size: .88rem; }
.tabs button[aria-pressed="true"] { background: var(--raised); color: var(--text); }
.search { display: flex; align-items: center; gap: .5rem; background: var(--canvas); border: 1px solid var(--gold); border-radius: var(--radius); padding: .45rem .6rem; }
.search input { all: unset; flex: 1; font-size: .92rem; }
.lib { display: grid; margin: 0 -.45rem; }
.add { margin-left: auto; display: inline-flex; align-items: center; gap: .3rem; font-size: .82rem; border: 1px solid var(--line-strong); padding: .25rem .55rem; border-radius: var(--radius); }
.add:hover { background: var(--raised); }
.inservice { margin-left: auto; color: var(--ready-text); font-size: .82rem; display: inline-flex; gap: .3rem; align-items: center; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .45rem; padding: .5rem .85rem; border-radius: var(--radius); border: 1px solid var(--line-strong); background: var(--raised); font-size: .9rem; font-weight: 500; }
.btn:hover { border-color: var(--faint); }
.btn.primary { background: var(--gold); color: var(--on-gold); border-color: var(--gold); }
.btn.primary:hover { background: var(--gold-hover); }
.btn.danger { background: var(--live-strong); border-color: var(--live-strong); color: #fff; }
.btn.wide { width: 100%; }
.seg { display: flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.seg button { flex: 1; padding: .45rem 0; font-size: .88rem; color: var(--muted); border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--raised); color: var(--text); }
.switch { display: flex; align-items: center; justify-content: space-between; font-size: .92rem; padding: .2rem 0; }
.sw { width: 34px; height: 20px; border-radius: 999px; background: var(--line-strong); position: relative; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--text); transition: transform .2s var(--ease); }
.sw.on { background: var(--ready); }
.sw.on::after { transform: translateX(14px); }
.label { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); font-weight: 600; }
.meter { height: 6px; background: var(--raised); border-radius: 999px; overflow: hidden; }
.meter i { display: block; height: 100%; width: 62%; background: var(--ready); }
dl.keys { display: grid; grid-template-columns: auto 1fr; gap: .45rem .9rem; margin: 0; font-size: .9rem; }
dl.keys dt { text-align: right; } dl.keys dd { margin: 0; color: var(--muted); }

/* Plan main */
.svc-head { display: flex; align-items: flex-start; gap: 1rem; margin-bottom: 1.1rem; }
.svc-head h1 { font-size: 1.5rem; font-weight: 650; }
.svc-head .actions { margin-left: auto; display: flex; gap: .5rem; }
.notice { display: flex; gap: .6rem; align-items: center; background: var(--warn-soft); border: 1px solid rgba(245,165,36,.3); border-radius: var(--radius-lg); padding: .65rem .85rem; font-size: .92rem; margin-bottom: 1.1rem; }
.notice .link { margin-left: auto; color: var(--warn); font-weight: 600; font-size: .88rem; }
ol.order { list-style: none; margin: 0; padding: 0; max-width: 860px; }
.hdr { font-size: .78rem; text-transform: uppercase; letter-spacing: .1em; color: var(--faint); font-weight: 650; padding: 1.1rem .4rem .45rem; border-bottom: 1px solid var(--line); }
.item { display: flex; align-items: center; gap: .85rem; padding: .7rem .4rem; border-bottom: 1px solid var(--line); }
.item:hover { background: rgba(255,255,255,.02); }
.grip { color: var(--line-strong); }
.num { width: 1.4rem; text-align: right; color: var(--faint); font-variant-numeric: tabular-nums; font-size: .9rem; }
.tile { width: 3.4rem; height: 1.95rem; border-radius: 4px; background: #000; display: grid; place-items: center; color: var(--muted); border: 1px solid var(--line); flex-shrink: 0; }
.item .t { font-weight: 550; }
.item .sub { color: var(--faint); font-size: .85rem; }
.item .end { margin-left: auto; display: flex; align-items: center; gap: .6rem; color: var(--faint); font-size: .85rem; }
.chip { font-size: .75rem; padding: .15rem .45rem; border-radius: 4px; border: 1px solid var(--line-strong); color: var(--muted); }
.chip.warn { border-color: rgba(245,165,36,.45); color: var(--warn); }

/* Present main */
.stage { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 1.2rem; align-items: start; }
.body.closed .stage { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
.cap { display: flex; align-items: center; gap: .5rem; font-size: .85rem; color: var(--muted); margin-bottom: .45rem; }
.cap b { color: var(--live); letter-spacing: .06em; font-size: .78rem; }
.screen { aspect-ratio: 16/9; background: #000; border-radius: var(--radius-lg); display: grid; place-items: center; text-align: center; padding: 6%; font-weight: 650; color: #fff; line-height: 1.35; }
.screen.live { outline: 2px solid var(--live); outline-offset: 2px; font-size: clamp(.8rem, 1.55vw, 1.35rem); }
.screen.next { font-size: clamp(.55rem, .9vw, .85rem); border: 1px solid var(--line); }
.transport { display: flex; gap: .5rem; margin-top: 1rem; flex-wrap: wrap; }
.transport .btn { padding: .65rem 1.1rem; font-size: .95rem; }
.transport .btn.primary { min-width: 9rem; }
.btn kbd { border-color: currentColor; color: inherit; opacity: .7; }
.stopsound { margin-left: auto; }
.slides-head { display: flex; align-items: baseline; gap: .6rem; margin: 1.6rem 0 .7rem; }
.slides-head h2 { font-size: 1.05rem; }
.slides-head .faint { margin-left: auto; font-size: .85rem; }
.slides { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: .8rem; }
.slide { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-lg); overflow: hidden; text-align: left; padding: 0; }
.slide:hover { border-color: var(--line-strong); }
.slide .screen { border-radius: 0; font-size: .62rem; padding: 8%; }
.slide .foot { display: flex; align-items: center; gap: .5rem; padding: .45rem .6rem; font-size: .8rem; color: var(--muted); }
.sec { font-weight: 700; font-size: .75rem; }
.sec.v { color: var(--section-verse); } .sec.c { color: var(--section-chorus); } .sec.b { color: var(--section-bridge); }
.slide.on { border-color: var(--live); }

/* Status bar */
footer { display: flex; align-items: center; gap: 1rem; padding: .4rem 1rem; border-top: 1px solid var(--line); font-size: .8rem; color: var(--muted); }
footer .sp { margin-left: auto; }
footer span { display: inline-flex; align-items: center; gap: .4rem; }

@media (max-width: 900px) {
  .body { grid-template-columns: minmax(0,1fr) 0px; }
  .body:not(.closed) .panel-slot { position: fixed; right: 0; top: 52px; bottom: 34px; width: 370px; max-width: 100vw; padding: .6rem; z-index: 5; }
  .panel { width: 100%; }
  .stage { grid-template-columns: 1fr !important; }
  .onair { display: none; }
}
</style>
</head>
<body>
<div class="shell">
  <header>
    <div class="logo">
      <svg width="16" height="18" viewBox="0 0 16 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 1.5c1.6 1.6 1.6 3.4 0 4.6-1.6-1.2-1.6-3 0-4.6Z" fill="currentColor"/><path d="M5 8.5h6M8 8.5v6M4.5 16.5h7"/></svg>
      Lampstand
    </div>
    <div class="modes" role="group" aria-label="Mode">
      <button data-mode="plan">Plan</button>
      <button data-mode="present">Present</button>
    </div>
    <div class="right">
      <p class="onair">Live service: <b>Sunday service</b></p>
      <button class="tb"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6.5"/><path d="M6.2 6.2a1.9 1.9 0 1 1 2.6 1.8c-.5.2-.8.6-.8 1.1v.4M8 11.5v.1" stroke-linecap="round"/></svg>Help</button>
      <button class="tb"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4" stroke-linecap="round"/></svg>Setup</button>
      <button class="tb panel-toggle" id="toggle" title="Hide or show the Library and the controls (\)">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><path d="M10 2.5v11"/></svg>
        <span id="toggle-word">Hide library &amp; controls</span><kbd>\</kbd>
      </button>
    </div>
  </header>

  <div class="body" id="body">
    <main id="main"></main>
    <div class="panel-slot"><aside class="panel" aria-label="Library and controls">
      <div class="panel-head" id="panel-head"></div>
      <div class="panel-body" id="panel-body"></div>
    </aside></div>
  </div>

  <footer>
    <span><span class="dot"></span>This device only</span>
    <span class="faint">Mockup: hide it with <kbd>\</kbd>. It opens again every time Lampstand starts</span>
    <span class="sp"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="2.5" width="13" height="9" rx="1.5"/><path d="M5.5 14h5"/></svg>2 screens · 2 on</span>
  </footer>
</div>

<script>
const I = {

  plus: '<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>',
  search: '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" style="color:var(--muted)"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg>',
  music: '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M6 12V3.5l7-1.5V10"/><circle cx="4.3" cy="12" r="1.8"/><circle cx="11.3" cy="10" r="1.8"/></svg>',

/* ---------- Main areas ---------- */
function planMain() {

/* ---------- Render ---------- */
const $ = id => document.getElementById(id);
let lastView = null;
function render(dir) {
  const m = state.mode, v = state.view[m], view = views[m][v];
  document.querySelectorAll(".modes button").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === m));
  $("main").innerHTML = m === "plan" ? planMain() : presentMain();
  $("body").classList.toggle("closed", !state.open[m]);
  $("toggle").setAttribute("aria-pressed", state.open[m]);
  $("toggle-word").textContent = state.open[m] ? "Hide library & controls" : "Show library & controls";
  $("panel-head").innerHTML = v === "overview"
    ? `<h2>Library &amp; controls</h2><button class="hide" data-hide>Hide <kbd>\\</kbd></button>`
    : `<button class="back" data-go="overview">${I.back}Back</button><span class="faint">/</span><span class="crumb">${view.title}</span><button class="hide" data-hide>Hide <kbd>\\</kbd></button>`;
  const pb = $("panel-body");
  pb.innerHTML = view.body();
  if (dir) { pb.classList.remove("enter", "enter-back"); void pb.offsetWidth; pb.classList.add(dir === "back" ? "enter-back" : "enter"); }
  save();
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-mode],[data-go],[data-open],[data-hide],[data-lib],[data-screen],[data-sw],#toggle");
  if (!t) return;
  if (t.id === "toggle" || t.dataset.hide !== undefined) { state.open[state.mode] = !state.open[state.mode]; return render(); }
  if (t.dataset.mode) { state.mode = t.dataset.mode; return render(); }
  if (t.dataset.open) { state.open[state.mode] = true; state.view[state.mode] = t.dataset.open; return render("in"); }
  if (t.dataset.go) { const back = t.dataset.go === "overview"; state.view[state.mode] = t.dataset.go; return render(back ? "back" : "in"); }
  if (t.dataset.lib) { state.libTab = t.dataset.lib; return render(); }
  if (t.dataset.screen) { state.screenMode = t.dataset.screen; return render(); }
  if (t.dataset.sw) { state[t.dataset.sw] = !state[t.dataset.sw]; return render(); }
});
document.addEventListener("keydown", e => {
  if (e.target instanceof Element && e.target.closest("input")) return;
  if (e.key === "\\" || e.code === "Backslash") { e.preventDefault(); state.open[state.mode] = !state.open[state.mode]; render(); }
  if (e.key === "/" && state.mode === "present") { e.preventDefault(); state.open.present = true; state.view.present = "library"; render("in"); }
  if (e.key === "Escape" && state.view[state.mode] !== "overview") { state.view[state.mode] = "overview"; render("back"); }
});
render();
</script>
