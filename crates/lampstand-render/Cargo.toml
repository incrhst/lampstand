[package]
name = "lampstand-render"
version.workspace = true
edition.workspace = true
license.workspace = true
# wgpu 30 needs 1.87 and cosmic-text 0.19 needs 1.89, above the workspace's 1.80.
rust-version = "1.89"

[dependencies]
lampstand-core = { path = "../lampstand-core" }
bytemuck = { version = "1.25", features = ["derive"] }
glyphon = "0.12"
image = { version = "0.25", default-features = false, features = ["png"] }
pollster = "1.0"
wgpu = "30"
winit = "0.30.13"
