<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stream transparency check</title>
<!-- Dev only: shows /stream over a checkerboard, as OBS would composite it.
     Any query string is passed through, e.g. /dev/obs.html?layout=full -->
<style>
  html, body { margin: 0; height: 100%; background: #333; }
  .checker {
    position: fixed;
    inset: 0;
    background-color: #bbb;
    background-image:
      linear-gradient(45deg, #eee 25%, transparent 25%, transparent 75%, #eee 75%),
      linear-gradient(45deg, #eee 25%, transparent 25%, transparent 75%, #eee 75%);
    background-size: 64px 64px;
    background-position: 0 0, 32px 32px;
  }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; }
</style>
</head>
<body>
<div class="checker"></div>
<iframe id="stream" title="stream" allowtransparency="true"></iframe>
<script>
  document.getElementById("stream").src = "/stream" + location.search;
</script>
</body>
</html>
