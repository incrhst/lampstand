[package]
name = "lampstand-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
# automerge 0.12 needs Rust 1.90.
rust-version = "1.90"

[features]
default = ["tls"]
# wss:// support for connecting to a relay behind TLS. The relay binary turns
# it off: it speaks plain ws and sits behind a TLS reverse proxy.
tls = ["tokio-tungstenite/native-tls"]

[dependencies]
automerge = "0.12"
mdns-sd = "0.21"
tokio = { version = "1", features = ["net", "sync", "rt", "macros", "time"] }
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rand = "0.9"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
