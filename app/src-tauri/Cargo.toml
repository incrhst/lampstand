[package]
name = "lampstand-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Lampstand desktop app: the Tauri shell around the Rust core"

[lib]
name = "lampstand_app"
path = "src/lib.rs"

[[bin]]
name = "lampstand"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
lampstand-api.workspace = true
lampstand-connectors = { workspace = true, features = ["obs"] }
lampstand-core.workspace = true
lampstand-import.workspace = true
lampstand-layout.workspace = true
lampstand-library.workspace = true
lampstand-live.workspace = true
lampstand-media.workspace = true
lampstand-render.workspace = true
lampstand-slides.workspace = true
lampstand-server.workspace = true
lampstand-sync = { workspace = true, features = ["net"] }
base64.workspace = true
chrono.workspace = true
gethostname.workspace = true
if-addrs = "0.15"
image.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-global-shortcut.workspace = true
tauri-plugin-updater.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time"] }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
autosurgeon.workspace = true
automerge.workspace = true
futures-util.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio-tungstenite.workspace = true
wiremock.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time"] }

# Product names for displays (the window system only gives a model number).
[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true
