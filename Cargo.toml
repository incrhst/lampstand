[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/incrhst/lampstand"
# Tracks stable minus about six months; see docs/ARCHITECTURE.md.
rust-version = "1.95"

# Every third-party version is pinned here, once. Crates use `foo.workspace = true`.
[workspace.dependencies]
automerge = "0.12"
autosurgeon = "0.14"
base64 = "0.23"
blake3 = "1.8"
bytemuck = { version = "1.25", features = ["derive"] }
cosmic-text = "0.19"
ed25519-dalek = "2.2"
encoding_rs = "0.8"
flate2 = "1.1"
getrandom = "0.3"
glyphon = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "tiff"] }
lyon = "1.0"
pollster = "0.4"
proptest = "1.7"
prost = "0.14"
prost-build = "0.14"
protox = "0.9"
quick-xml = "0.42"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
roxmltree = "0.21"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
tempfile = "3"
tokio = { version = "1.53", features = ["macros", "rt"] }
unicode-normalization = "0.1"
url = "2.5"
ts-rs = { version = "12.0", default-features = false, features = ["serde-compat"] }
uuid = { version = "1.28", features = ["v7", "serde"] }
wgpu = "30"
wiremock = "0.6"
zip = { version = "9", default-features = false, features = ["deflate"] }

lampstand-core = { path = "crates/lampstand-core" }
lampstand-layout = { path = "crates/lampstand-layout" }
lampstand-live = { path = "crates/lampstand-live" }
lampstand-slides = { path = "crates/lampstand-slides" }
lampstand-render = { path = "crates/lampstand-render" }
lampstand-media = { path = "crates/lampstand-media" }
lampstand-sync = { path = "crates/lampstand-sync" }
lampstand-library = { path = "crates/lampstand-library" }
lampstand-import = { path = "crates/lampstand-import" }
lampstand-connectors = { path = "crates/lampstand-connectors" }
lampstand-server = { path = "crates/lampstand-server" }
lampstand-api = { path = "crates/lampstand-api" }
