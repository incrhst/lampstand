[workspace]
resolver = "2"
members = ["crates/*", "app/src-tauri", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/incrhst/lampstand"
# Tracks stable minus about six months; see docs/ARCHITECTURE.md.
rust-version = "1.95"

# Every third-party version is pinned here, once. Crates use `foo.workspace = true`.
[workspace.dependencies]
automerge = "0.12"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
autosurgeon = "0.14"
base64 = "0.23"
blake3 = "1.8"
bytemuck = { version = "1.25", features = ["derive"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
cosmic-text = "0.19"
# PPTX reader (docs/decisions/0001-pptx-reader.md). Pinned to one commit: upstream
# moves fast. Only `lampstand-slides` uses these; nothing of theirs is in its API.
deckcraft-anim = { git = "https://github.com/storytold/deckcraft", rev = "cb78440a1618e6a2c1df55dd7bff74719685518c" }
deckcraft-color = { git = "https://github.com/storytold/deckcraft", rev = "cb78440a1618e6a2c1df55dd7bff74719685518c" }
deckcraft-geom = { git = "https://github.com/storytold/deckcraft", rev = "cb78440a1618e6a2c1df55dd7bff74719685518c" }
deckcraft-model = { git = "https://github.com/storytold/deckcraft", rev = "cb78440a1618e6a2c1df55dd7bff74719685518c" }
deckcraft-pptx = { git = "https://github.com/storytold/deckcraft", rev = "cb78440a1618e6a2c1df55dd7bff74719685518c" }
# The quick-xml DeckCraft parses with, so `slides` can count a deck's XML
# with the same reader before DeckCraft builds its DOM.
deckcraft-quick-xml = { package = "quick-xml", version = "=0.41.0" }
ed25519-dalek = "2.2"
encoding_rs = "0.8"
flate2 = "1.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
gethostname = "1.1"
getrandom = "0.3"
glyphon = "0.12"
insta = { version = "1.43", features = ["json"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "tiff"] }
libc = "0.2"
lyon = "1.0"
mdns-sd = "0.21"
objc2 = "0.5"
objc2-app-kit = { version = "0.2", default-features = false, features = ["std", "NSColor", "NSResponder", "NSView", "NSWindow"] }
pollster = "0.4"
proptest = "1.7"
prost = "0.14"
prost-build = "0.14"
protox = "0.9"
postcard = { version = "1", default-features = false, features = ["use-std"] }
quick-xml = "0.42"
raw-window-handle = "0.6"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
roxmltree = "0.21"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
sha2 = "0.10"
spake2 = "0.4"
tauri = { version = "2.12", features = ["unstable"] }
tauri-build = { version = "2.7", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-global-shortcut = "2.3"
tempfile = "3"
tokio = { version = "1.53", features = ["macros", "rt"] }
# 0.29 to match the tungstenite inside axum's `ws`.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }
unicode-normalization = "0.1"
url = "2.5"
ts-rs = { version = "12.0", default-features = false, features = ["serde-compat"] }
uuid = { version = "1.28", features = ["v5", "v7", "serde"] }
wgpu = "30"
wiremock = "0.6"
winit = "0.30"
# 2.x to share curve25519-dalek 4 with ed25519-dalek.
x25519-dalek = { version = "2.0", features = ["getrandom", "zeroize"] }
zstd = "0.13"
zeroize = "1.8"
zip = { version = "9", default-features = false, features = ["deflate"] }

lampstand-core = { path = "crates/lampstand-core" }
lampstand-layout = { path = "crates/lampstand-layout" }
lampstand-live = { path = "crates/lampstand-live" }
lampstand-slides = { path = "crates/lampstand-slides" }
lampstand-render = { path = "crates/lampstand-render" }
lampstand-media = { path = "crates/lampstand-media" }
lampstand-sync = { path = "crates/lampstand-sync" }
lampstand-library = { path = "crates/lampstand-library" }
lampstand-import = { path = "crates/lampstand-import" }
lampstand-connectors = { path = "crates/lampstand-connectors" }
lampstand-server = { path = "crates/lampstand-server" }
lampstand-api = { path = "crates/lampstand-api" }
