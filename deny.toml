# cargo-deny configuration. CI runs `cargo deny check licenses bans`.
# Lampstand is GPL-3.0-or-later, so every dependency must be GPL-3.0-compatible.

[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "OFL-1.1",
    "CC0-1.0",
    "GPL-3.0",
    "GPL-3.0-or-later",
    "GPL-3.0-only",
    "LGPL-3.0-or-later",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
